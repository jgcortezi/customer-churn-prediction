[project]
name = "customer-churn-prediction"
version = "1.0.0"
description = "Previsão de cancelamento de clientes de telecom com scikit-learn"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks", "kaggle"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
